name: Apply listener hardening

on:
  push:
    branches:
      - fix/full-hardening-20260730
    paths:
      - scripts/apply-listener-hardening.mjs
      - .github/workflows/apply-listener-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-hardening-20260730
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-listener-hardening.mjs
      - name: Commit listener update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          if git diff --cached --quiet; then
            echo "Listener already current"
          else
            git commit -m "fix(network): bind Node Agent to configured host"
            git push origin HEAD:fix/full-hardening-20260730
          fi
