name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Compiled runtime smoke
        env:
          HOCKER_AGENT_HOST: 127.0.0.1
          HOCKER_AGENT_ALLOW_LAN: "false"
          PORT: "8081"
          PROJECT_ID: hocker-one
          NODE_ID: hocker-node-ci
          POLL_MS: "5000"
          HEARTBEAT_MS: "15000"
          MAX_COMMAND_AGE_MS: "300000"
          HOCKER_COMMAND_HMAC_SECRET: command-signing-secret-ci-1234567890
          HOCKER_AGENT_KEY: agent-api-secret-ci-0987654321
          ORCHESTRATOR_URL: ""
          HOCKER_ALLOW_UNSANDBOXED_SHELL: "false"
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: service-role-key-ci-1234567890
          SANDBOX_ENABLED: "true"
          SANDBOX_ROOT: ./sandbox-ci
          MIRROR_ENABLED: "false"
          MIRROR_PRIMARY_NODE_ID: ""
          MIRROR_NODE_ID: ""
        run: node --input-type=module --eval "await import('./dist/config.js')"

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit
        run: npm audit --audit-level=low
